<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Split</title>
<meta name="description" content="A speech timer that splits your talk into parts, so you always know if you're on time. For Windows and Android.">
<meta property="og:title" content="Speech Split">
<meta property="og:description" content="A speech timer that splits your talk into parts. Free for Windows and Android.">
<meta property="og:image" content="img/timer-light.webp">
<meta name="theme-color" content="#2B3A4A">
<link rel="icon" href="img/icon.png">
<style>
  :root {
    --bg: #F3F4F6; --surface: #FBFBFC; --surface2: #E9EBEE; --line: #DADDE2;
    --text: #1F2328; --sub: #5F6670; --ink: #2B3A4A; --on-ink: #FFFFFF;
    --green: #2E7D4F; --amber: #B26A00; --red: #C0392B; --blue: #2F6FB0;
    --glow1: rgba(46,125,79,0.16); --glow2: rgba(47,111,176,0.14); --glow3: rgba(224,161,0,0.12);
    --shadow: 0 1px 2px rgba(16,24,40,0.06), 0 12px 32px rgba(16,24,40,0.10);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131517; --surface: #1D2023; --surface2: #272B2F; --line: #363B40;
      --text: #E4E6E8; --sub: #979DA4; --ink: #D5DBE1; --on-ink: #15181B;
      --green: #6CCB8B; --amber: #F2C14E; --red: #EF7064; --blue: #8AB4F8;
      --glow1: rgba(108,203,139,0.12); --glow2: rgba(138,180,248,0.10); --glow3: rgba(242,193,78,0.08);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden;
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* Soft colour glows behind the hero */
  .glow { position: absolute; inset: -200px 0 auto 0; height: 900px; pointer-events: none; z-index: 0;
    background:
      radial-gradient(520px 380px at 78% 30%, var(--glow1), transparent 70%),
      radial-gradient(460px 360px at 18% 18%, var(--glow2), transparent 70%),
      radial-gradient(420px 320px at 60% 75%, var(--glow3), transparent 70%);
  }

  /* --- Top bar --- */
  nav { position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    background: color-mix(in srgb, var(--bg) 72%, transparent); border-bottom: 1px solid transparent; transition: border-color .3s; }
  nav.scrolled { border-bottom-color: var(--line); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); text-decoration: none; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .lang { display: flex; gap: 2px; background: var(--surface2); padding: 3px; border-radius: 10px; }
  .lang button { font: inherit; font-size: 13px; color: var(--sub); background: none; border: 0; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .lang button[aria-pressed="true"] { color: var(--text); background: var(--surface); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* --- Hero --- */
  .hero { position: relative; z-index: 1; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; padding: 56px 0 88px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--sub);
    background: var(--surface); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
  .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--glow1); }
  h1 { font-size: clamp(44px, 7vw, 76px); line-height: 1.0; margin: 20px 0 18px; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: var(--green); }
  .tagline { font-size: clamp(18px, 2vw, 21px); color: var(--sub); margin: 0 0 32px; max-width: 34ch; }
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; padding: 14px 22px 14px 18px; border-radius: 16px;
    background: var(--ink); color: var(--on-ink); border: 1.5px solid var(--ink); transition: transform .15s, box-shadow .15s; box-shadow: var(--shadow); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn:hover { transform: translateY(-2px); }
  .btn svg { width: 26px; height: 26px; flex: none; }
  .btn .lbl { display: flex; flex-direction: column; line-height: 1.25; }
  .btn strong { font-size: 16px; }
  .btn span { font-size: 12.5px; opacity: .72; }
  .meta { margin-top: 18px; color: var(--sub); font-size: 14px; display: flex; gap: 18px; flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; }

  /* --- Live demo "phone" --- */
  .stage { position: relative; display: flex; justify-content: center; }
  .device { position: relative; width: 330px; border-radius: 36px; padding: 10px; background: var(--surface2);
    box-shadow: var(--shadow), 0 40px 80px -20px rgba(16,24,40,.25); transform: rotate(-2deg); transition: transform .6s; }
  .device:hover { transform: rotate(0deg) translateY(-4px); }
  .screen { position: relative; overflow: hidden; border-radius: 28px; background: var(--bg); border: 1px solid var(--line); }
  .d-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 4px; font-size: 12px; color: var(--sub); }
  .d-total { display: flex; justify-content: space-between; align-items: flex-end; padding: 2px 18px 12px; }
  .lab { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; color: var(--sub); }
  .d-total .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .pill { display: inline-block; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 999px; color: #fff; background: var(--green); transition: background .3s; }
  @media (prefers-color-scheme: dark) { .pill { color: #0E2416; } }
  .pill.over { background: var(--red); } .pill.warn { background: var(--amber); }
  .d-seg { background: var(--surface); padding: 12px 18px 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .d-seg .row { display: flex; justify-content: space-between; }
  .d-seg h4 { margin: 4px 0 6px; font-size: 19px; }
  .clock { font-size: 64px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; transition: color .3s; }
  .clock.warn { color: var(--amber); } .clock.over { color: var(--red); }
  .bar { height: 6px; border-radius: 6px; background: var(--surface2); margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 6px; transition: width .9s linear, background .3s; }
  .bar i.warn { background: var(--amber); }
  .list { padding: 4px 0 6px; }
  .li { display: flex; align-items: center; gap: 10px; padding: 9px 18px; font-size: 14px; color: var(--sub); border-bottom: 1px solid var(--line); }
  .li:last-child { border-bottom: 0; }
  .li.cur { color: var(--text); font-weight: 700; background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .li .t { margin-left: auto; font-weight: 700; font-size: 13px; }
  .li .pill { font-size: 11px; padding: 2px 8px; }
  .ico { width: 16px; height: 16px; flex: none; }
  .d-ctrl { display: flex; gap: 8px; padding: 10px 12px 14px; }
  .d-ctrl span { flex: 1; text-align: center; font-size: 13px; font-weight: 700; padding: 12px 0; border-radius: 999px; border: 1.5px solid var(--line); }
  .d-ctrl span.next { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .finish { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(3px); opacity: 0; transition: opacity .4s; pointer-events: none; text-align: center; }
  .finish.show { opacity: 1; }
  .finish .trophy { font-size: 44px; }
  .finish b { font-size: 26px; }
  .finish small { color: var(--sub); font-size: 14px; }
  canvas.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .float { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 10px 14px; font-size: 13px; display: flex; align-items: center; gap: 10px; animation: bob 6s ease-in-out infinite; z-index: 3; }
  .float b { display: block; font-size: 15px; }
  .float.f1 { left: -34px; bottom: 26px; }
  .float.f2 { right: -22px; top: 205px; animation-delay: -3s; }
  @keyframes bob { 50% { transform: translateY(-8px); } }

  /* --- Sections --- */
  section.block { position: relative; z-index: 1; padding: 72px 0; }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green); margin: 0 0 10px; }
  h2 { font-size: clamp(30px, 4vw, 44px); line-height: 1.1; margin: 0 0 14px; letter-spacing: -0.025em; }
  .lead { color: var(--sub); font-size: 18px; max-width: 56ch; margin: 0 0 36px; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: s; }
  .step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .step::before { counter-increment: s; content: counter(s); display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--ink); color: var(--on-ink); font-weight: 700; margin-bottom: 14px; }
  .step h3 { margin: 0 0 6px; font-size: 18px; }
  .step p { margin: 0; color: var(--sub); font-size: 15px; }

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .feature { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; transition: transform .2s, box-shadow .2s; }
  .feature:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .feature .fi { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px; }
  .feature .fi svg { width: 22px; height: 22px; }
  .feature h3 { font-size: 18px; margin: 0 0 6px; }
  .feature p { margin: 0; color: var(--sub); font-size: 15px; }
  .c-green { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
  .c-amber { background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); }
  .c-blue { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
  .c-red { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }

  .gallery { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 8px 4px 24px; scrollbar-width: thin; }
  .gallery figure { margin: 0; flex: 0 0 240px; scroll-snap-align: start; }
  .gallery img { width: 100%; height: auto; border-radius: 22px; border: 1px solid var(--line); box-shadow: var(--shadow); display: block; }
  .gallery figcaption { font-size: 14px; color: var(--sub); margin-top: 12px; text-align: center; }

  .platforms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .plat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: flex; flex-direction: column; gap: 10px; }
  .plat svg { width: 32px; height: 32px; color: var(--text); }
  .plat h3 { margin: 4px 0 0; font-size: 20px; }
  .plat p { margin: 0; color: var(--sub); font-size: 15px; flex: 1; }
  .plat a { align-self: flex-start; margin-top: 8px; font-weight: 600; color: var(--text); text-decoration: none; border-bottom: 2px solid var(--green); }
  .plat .soon { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); padding: 4px 10px; border-radius: 999px; }

  .faq { max-width: 760px; }
  details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; padding: 14px 0; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--sub); transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  details p { margin: 0 0 16px; color: var(--sub); font-size: 15px; }

  .cta { text-align: center; background: var(--ink); color: var(--on-ink); border-radius: 28px; padding: 56px 24px; position: relative; overflow: hidden; }
  .cta h2 { color: var(--on-ink); }
  .cta p { opacity: .75; margin: 0 0 28px; }
  .cta .buttons { justify-content: center; }
  .cta .btn { background: var(--on-ink); color: var(--ink); border-color: var(--on-ink); }
  .cta .btn.secondary { background: transparent; color: var(--on-ink); border-color: color-mix(in srgb, var(--on-ink) 35%, transparent); }

  footer { padding: 40px 0 56px; color: var(--sub); font-size: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  footer a { color: var(--sub); }

  /* Reveal on scroll */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .float { animation: none; } .device { transform: none; }
    html { scroll-behavior: auto; }
  }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; gap: 48px; padding-top: 28px; }
    .steps, .features, .platforms { grid-template-columns: 1fr; }
    .float.f1 { left: 0; } .float.f2 { right: 0; }
  }
  @media (max-width: 520px) {
    .btn { flex: 1 1 100%; }
    .device { width: 300px; }
    .clock { font-size: 56px; }
    .float { display: none; }
    .lang button { padding: 5px 7px; }
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<nav id="nav">
  <div class="wrap">
    <a class="brand" href="#"><img src="img/icon.png" alt=""> Speech Split</a>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button>
      <button data-lang="no">NO</button>
      <button data-lang="de">DE</button>
    </div>
  </div>
</nav>

<main class="wrap">
  <!-- HERO -->
  <section class="hero">
    <div>
      <span class="eyebrow"><i></i><span data-t="eyebrow"></span></span>
      <h1 data-t="headline"></h1>
      <p class="tagline" data-t="tagline"></p>
      <div class="buttons">
        <a class="btn dl-windows" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span class="lbl"><strong data-t="dlWindows"></strong><span data-t="dlWindowsSub"></span></span>
        </a>
        <a class="btn secondary dl-android" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
          <span class="lbl"><strong data-t="dlAndroid"></strong><span data-t="dlAndroidSub"></span></span>
        </a>
      </div>
      <div class="meta"><span id="version" data-t="free"></span></div>
    </div>

    <div class="stage" aria-hidden="true">
      <div class="float f1"><span class="pill tnum" id="f-pill">-00:12</span><span><b data-t="floatAhead"></b><span data-t="floatAheadSub"></span></span></div>
      <div class="device">
        <div class="screen" id="demo">
          <div class="d-top"><span data-t="demoTitle"></span><span>✕</span></div>
          <div class="d-total">
            <div><div class="lab" data-t="demoTotal"></div><div class="big tnum" id="d-total">14:51</div></div>
            <div style="text-align:right"><div class="lab" data-t="demoAhead" style="margin-bottom:4px"></div><span class="pill tnum" id="d-diff">00:00</span></div>
          </div>
          <div class="d-seg">
            <div class="row"><span class="lab" data-t="demoNow"></span><span class="lab" data-t="demoTarget"></span></div>
            <h4 data-t="s4"></h4>
            <div class="lab" data-t="demoRemaining"></div>
            <div class="clock tnum" id="d-clock">00:09</div>
            <div class="bar"><i id="d-bar"></i></div>
          </div>
          <div class="list">
            <div class="li"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-t="s1"></span><span class="pill tnum" style="margin-left:auto">-00:04</span><span class="t tnum">02:00</span></div>
            <div class="li"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-t="s2"></span><span class="pill over tnum" style="margin-left:auto">+00:06</span><span class="t tnum">07:00</span></div>
            <div class="li"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-t="s3"></span><span class="pill tnum" style="margin-left:auto">-00:02</span><span class="t tnum">04:00</span></div>
            <div class="li cur"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg><span data-t="s4"></span><span class="t tnum">02:00</span></div>
          </div>
          <div class="d-ctrl"><span data-t="demoPause"></span><span class="next" data-t="demoFinish"></span></div>
          <div class="finish" id="d-finish"><div class="trophy">🏆</div><b data-t="perfect"></b><small data-t="onTime"></small></div>
          <canvas class="confetti" id="d-confetti"></canvas>
        </div>
      </div>
      <div class="float f2"><span style="font-size:22px">🎯</span><span><b data-t="floatPerfect"></b><span data-t="floatPerfectSub"></span></span></div>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section class="block reveal">
    <p class="kicker" data-t="howKicker"></p>
    <h2 data-t="howTitle"></h2>
    <p class="lead" data-t="howLead"></p>
    <div class="steps">
      <div class="step"><h3 data-t="st1t"></h3><p data-t="st1"></p></div>
      <div class="step"><h3 data-t="st2t"></h3><p data-t="st2"></p></div>
      <div class="step"><h3 data-t="st3t"></h3><p data-t="st3"></p></div>
    </div>
  </section>

  <!-- FEATURES -->
  <section class="block reveal">
    <p class="kicker" data-t="featKicker"></p>
    <h2 data-t="featuresTitle"></h2>
    <p class="lead" data-t="featLead"></p>
    <div class="features">
      <div class="feature"><div class="fi c-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M4 12h16M4 18h7"/></svg></div><h3 data-t="f1t"></h3><p data-t="f1"></p></div>
      <div class="feature"><div class="fi c-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div><h3 data-t="f2t"></h3><p data-t="f2"></p></div>
      <div class="feature"><div class="fi c-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></div><h3 data-t="f3t"></h3><p data-t="f3"></p></div>
      <div class="feature"><div class="fi c-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></div><h3 data-t="f4t"></h3><p data-t="f4"></p></div>
      <div class="feature"><div class="fi c-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></div><h3 data-t="f5t"></h3><p data-t="f5"></p></div>
      <div class="feature"><div class="fi c-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></div><h3 data-t="f6t"></h3><p data-t="f6"></p></div>
    </div>
  </section>

  <!-- SCREENSHOTS -->
  <section class="block reveal">
    <p class="kicker" data-t="shotsKicker"></p>
    <h2 data-t="shotsTitle"></h2>
    <div class="gallery">
      <figure><img src="img/ready-light.webp" alt="" loading="lazy" width="440" height="820"><figcaption data-t="cap1"></figcaption></figure>
      <figure><img src="img/timer-light.webp" alt="" loading="lazy" width="440" height="820"><figcaption data-t="cap2"></figcaption></figure>
      <figure><img src="img/bigclock-light.webp" alt="" loading="lazy" width="440" height="820"><figcaption data-t="cap3"></figcaption></figure>
      <figure><img src="img/history-dark.webp" alt="" loading="lazy" width="440" height="820"><figcaption data-t="cap4"></figcaption></figure>
    </div>
  </section>

  <!-- PLATFORMS -->
  <section class="block reveal">
